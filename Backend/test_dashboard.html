<!doctype html>
<html>
  <head>
    <title>GuardDog Telemetry Dashboard</title>
    <style>
      body {
        font-family: monospace;
        background-color: #1e1e1e;
        color: #00ff00;
        padding: 20px;
      }
      #data-box {
        background: #000;
        padding: 15px;
        border: 1px solid #00ff00;
        width: 300px;
      }
      h2 {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h2>🦿 GuardDog Live Telemetry</h2>
    <div id="status">Connecting to robot...</div>
    <br />
    <div id="data-box">Waiting for data stream...</div>

    <script>
      // Connect to the FastAPI WebSocket we just built
      const ws = new WebSocket("ws://127.0.0.1:8000/ws/telemetry");

      const statusDiv = document.getElementById("status");
      const dataBox = document.getElementById("data-box");

      ws.onopen = function (event) {
        statusDiv.innerHTML = "🟢 STATUS: Connected to Backend";
        statusDiv.style.color = "lime";
      };

      ws.onmessage = function (event) {
        // Parse the incoming JSON from your Python server
        const data = JSON.parse(event.data);

        // Display it in the box
        dataBox.innerHTML = `
                <strong>Battery:</strong> ${data.battery_pct}% <br>
                <strong>Motor State:</strong> ${data.motor_state} <br>
                <strong>Current Gait:</strong> ${data.current_gait} <br>
                <strong>CPU Temp:</strong> ${data.cpu_temp} °C
            `;
      };

      ws.onclose = function (event) {
        statusDiv.innerHTML = "🔴 STATUS: Disconnected";
        statusDiv.style.color = "red";
      };
    </script>
  </body>
</html>
